<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blainville RP QC - Roleplay</title>

    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================
           VARIABLES & STYLE DE BASE
           ========================================== */
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --discord-color: #5865F2;
            --border-color: rgba(239, 68, 68, 0.25);
            --phone-bg: #000000;
            --phone-card: #121212;
            --phone-text: #ffffff;
            --phone-card-border: rgba(255, 255, 255, 0.08);
        }

        .phone-screen.theme-light {
            --phone-bg: #f2f2f7;
            --phone-card: #ffffff;
            --phone-text: #000000;
            --phone-card-border: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('fond.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        a, a:visited, a:hover, a:active {
            text-decoration: none;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: rgba(15, 23, 42, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-logo {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo-bold { color: #ffffff !important; }
        .logo-tag { color: var(--primary) !important; }

        .nav-links a {
            color: var(--text-muted);
            margin: 0 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
        }

        .btn-discord {
            background-color: var(--discord-color);
            color: #ffffff !important;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* SMARTPHONE FRAME */
        .page-container {
            max-width: 1100px;
            margin: 6rem auto 3rem auto;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .page-header h1 span { color: var(--primary); }

        .phone-wrapper {
            width: 360px;
            height: 720px;
            background: #000;
            border-radius: 46px;
            padding: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(239, 68, 68, 0.25);
            border: 3px solid #334155;
            position: relative;
            user-select: none;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background-color: var(--phone-bg);
            color: var(--phone-text);
            border-radius: 36px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .phone-notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 95px;
            height: 22px;
            background-color: #000;
            border-radius: 20px;
            z-index: 100;
        }

        .status-bar {
            height: 38px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 90;
            flex-shrink: 0;
        }

        .app-view {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 6px 14px 75px 14px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .app-view::-webkit-scrollbar { width: 4px; }
        .app-view::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .app-view.active { display: flex; }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 800;
            font-size: 1.4rem;
            margin-bottom: 12px;
            padding-top: 4px;
        }

        .btn-back {
            color: #3b82f6;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Groupes de réglages */
        .settings-group {
            background-color: var(--phone-card);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 14px;
            border: 1px solid var(--phone-card-border);
            flex-shrink: 0;
        }

        .settings-item {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--phone-card-border);
            cursor: pointer;
        }

        .settings-item:last-child { border-bottom: none; }

        .settings-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-icon {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.85rem;
        }

        .settings-item-right {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Switch Toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(18px); }

        /* Wallpaper Grid */
        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
            padding-bottom: 10px;
        }

        .wallpaper-card {
            height: 110px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .wallpaper-card.selected::after {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 8px; right: 8px;
            background: #2563eb; color: #fff;
            width: 18px; height: 18px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem;
        }

        /* Grid Home App */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 15px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .icon-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .app-label {
            font-size: 0.65rem;
            text-align: center;
            font-weight: 500;
        }

        .phone-dock {
            position: absolute;
            bottom: 14px;
            left: 12px;
            right: 12px;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 95;
        }

        .phone-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--phone-card-border);
            background: var(--phone-card);
            color: var(--phone-text);
            font-size: 0.85rem;
            margin-bottom: 10px;
            outline: none;
        }

        .phone-btn {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .home-bar {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background-color: var(--phone-text);
            border-radius: 2px;
            cursor: pointer;
            z-index: 100;
            opacity: 0.6;
        }

        .phone-notif {
            position: absolute;
            top: 42px;
            left: 10px;
            right: 10px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--primary);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            color: #fff;
            display: none;
            z-index: 110;
        }

        /* ÉCRAN DE VERROUILLAGE & CLAVIER PIN */
        .lock-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pin-dots {
            display: flex;
            gap: 12px;
            margin: 20px 0 30px 0;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #64748b;
            transition: background 0.2s;
        }

        .dot.active {
            background: #ef4444;
            border-color: #ef4444;
        }

        .pin-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 220px;
        }

        .key-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .key-btn:active { background: rgba(255, 255, 255, 0.3); }

        /* BANQUE STYLE & MODALE CODES */
        .bank-card {

            border-radius: 18px;
            padding:
